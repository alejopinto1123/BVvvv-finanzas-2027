<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Plan Financiero 2027 · V5</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#64748b;--line:#e5e7eb;--accent:#2563eb;--green:#16a34a;--orange:#ea580c;--red:#dc2626;--soft:#f8fafc}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:760px;margin:auto;padding:16px 14px 40px}.hero{background:#111827;color:white;border-radius:22px;padding:20px;margin-bottom:12px}
h1{font-size:25px;margin:0 0 5px}.sub{color:#cbd5e1;font-size:13px}.nav{display:flex;gap:7px;overflow:auto;padding:4px 0 12px;position:sticky;top:0;background:var(--bg);z-index:5}.nav button{border:1px solid var(--line);background:white;border-radius:12px;padding:9px 12px;white-space:nowrap;font-weight:700}.nav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 2px 8px #00000008}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:var(--soft);border-radius:14px;padding:12px}.metric small{color:var(--muted);display:block}.metric strong{font-size:20px}
input,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:11px;font-size:16px;margin-top:7px;background:white;color:var(--text)}label{display:block;margin-top:10px;font-size:13px}
.status{padding:12px;border-radius:13px;margin-top:10px;font-weight:800}.ok{background:#ecfdf5;color:#166534}.surplus{background:#eff6ff;color:#1d4ed8}.short{background:#fef2f2;color:#b91c1c}.warn{background:#fff7ed;color:#9a3412}
.chartbox{display:flex;justify-content:center}.pie{width:min(330px,80vw);height:min(330px,80vw);border-radius:50%;position:relative;box-shadow:inset 0 0 0 1px #fff,0 5px 18px #00000012}.hole{position:absolute;inset:27%;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:13px;padding:15px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:14px}.leg{font-size:12px;display:flex;gap:6px;align-items:center}.dot{width:11px;height:11px;border-radius:3px;flex:none}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.row:last-child{border-bottom:0}.pct{color:var(--muted)}
h2{font-size:18px;margin:4px 0 10px}h3{font-size:15px;margin:14px 0 6px}.note{font-size:13px;color:var(--muted);line-height:1.45}
.progress{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--accent);transition:width .25s ease}.bar.over{background:var(--red)}.bar.done{background:var(--green)}
.goal{margin:14px 0;padding:12px;border:1px solid var(--line);border-radius:14px}.goaltop{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:6px}.goal-actions{display:flex;gap:7px;margin-top:9px}.goal-actions button{flex:1}
button.action{border:0;background:var(--accent);color:white;border-radius:11px;padding:10px 12px;font-weight:700;margin-top:8px}.smallbtn{border:1px solid var(--line);background:white;border-radius:10px;padding:8px 10px;font-weight:700}.danger{color:#b91c1c;border-color:#fecaca;background:#fff}
.partida{padding:13px 0;border-bottom:1px solid var(--line)}.partida:last-child{border-bottom:0}.phead{display:flex;align-items:flex-start;gap:9px}.num{min-width:27px;height:27px;border-radius:9px;background:#eef2ff;color:#3730a3;display:grid;place-items:center;font-weight:800;font-size:12px}.pname{font-weight:800;flex:1}.pamount{font-weight:800;white-space:nowrap}.pmeta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:9px 0}.mini{font-size:12px;color:var(--muted)}.mini b{display:block;color:var(--text);font-size:13px;margin-top:2px}.barline{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:6px 0}
.formgrid{display:grid;grid-template-columns:1.3fr .7fr;gap:8px}.formgrid .full{grid-column:1/-1}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar button{flex:1;min-width:120px}.empty{padding:18px;text-align:center;color:var(--muted);background:var(--soft);border-radius:13px}
footer{font-size:11px;color:var(--muted);text-align:center;padding:15px}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}.formgrid{grid-template-columns:1.4fr .6fr .6fr}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero"><h1>💰 Plan Financiero 2027</h1><div class="sub">Control mensual · gastos · ingreso real · progreso · metas</div></section>
<div class="nav" id="nav"></div>
<main id="app"></main>
<footer>V5 · Los datos se guardan automáticamente en este dispositivo. Puedes editar topes, gastos reales y partidas sin perder la relación con sus barras.</footer>
</div>
<script>
const months=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const colors=["#2563eb","#16a34a","#f59e0b","#dc2626","#7c3aed","#0891b2","#ea580c","#db2777","#65a30d","#4f46e5","#475569","#14b8a6"];
const normal=[["Vida cotidiana",1400],["Apartamento",400],["Emergencia",400],["Colombia",400],["Viajes",350],["Liquidez inmediata",100],["Inversión",100],["Disfrutar",100],["Billetera",50]];
const initialData={
"Enero":[["Vida cotidiana",1400],["Colombia",400],["Ski",300],["Napoleón",280],["Aseo anual",260],["TV",200],["Tenis",150],["Vignette",120],["Clase Ski",100],["Cumpleaños mamá",90]],
"Febrero":normal,"Marzo":[...normal.slice(0,5),["Liquidez inmediata",100],["Inversión",100],["Disfrutar",100],["Billetera",50],["Pickerl / automóvil",750]],
"Abril":normal,"Mayo":normal,"Junio":normal,
"Julio":[["Vida cotidiana",1400],["Tiquetes Colombia",1200],["Colombia — fondo diciembre",1600],["Apartamento",700],["Emergencia",400],["Colombia mensual",400],["Viajes",350],["Liquidez inmediata",100],["Inversión",100],["Disfrutar",100],["Billetera",50]],
"Agosto":normal,"Septiembre":normal,"Octubre":normal,"Noviembre":normal,
"Diciembre":[["Vida cotidiana",1400],["Colombia — gastos diciembre",2800],["Apartamento",700],["Emergencia",400],["Colombia mensual",400],["Viajes",350],["Liquidez inmediata",100],["Inversión",100],["Disfrutar",100],["Billetera",50]]
};
const income={Enero:3300,Febrero:3300,Marzo:4050,Abril:3300,Mayo:3300,Junio:3300,Julio:6400,Agosto:3300,Septiembre:3300,Octubre:3300,Noviembre:3300,Diciembre:6400};
const KEY="finanzas2027-v5";
let saved=JSON.parse(localStorage.getItem(KEY)||"null");
let active=saved?.active||localStorage.getItem("activeMonth")||"Enero";
let real=saved?.real||JSON.parse(localStorage.getItem("realIncome2027")||"{}");
let monthsData=saved?.monthsData||buildInitial();
let goals=saved?.goals||{
"🏠 Apartamento":{target:7000,progress:0},"🛡️ Emergencia":{target:4400,progress:0},"💧 Liquidez inmediata":{target:1100,progress:0},"👛 Billetera":{target:550,progress:0},"📈 Inversión":{target:1000,progress:0},"✈️ Viaje siguiente":{target:700,progress:0}
};
function buildInitial(){const out={};months.forEach(m=>out[m]=(initialData[m]||[]).map(x=>({id:uid(),name:x[0],target:x[1],spent:0})));return out}
function uid(){return "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function euro(x){return new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(Number(x)||0)}
function pct(x,total){return total?Math.max(0,x/total*100):0}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function save(){localStorage.setItem(KEY,JSON.stringify({active,real,monthsData,goals}));localStorage.setItem("activeMonth",active)}
function sortMonth(){monthsData[active].sort((a,b)=>Number(b.target)-Number(a.target)||a.name.localeCompare(b.name))}
function renderNav(){document.getElementById("nav").innerHTML=months.map(m=>`<button class="${m===active?"active":""}" onclick="setMonth('${m}')">${m.slice(0,3)}</button>`).join("")}
function setMonth(m){active=m;save();render()}
function plannedTotal(){return monthsData[active].reduce((a,p)=>a+Number(p.target||0),0)}
function spentTotal(){return monthsData[active].reduce((a,p)=>a+Number(p.spent||0),0)}
function realIncome(){return real[active]??income[active]}
function editGoal(name){const g=goals[name];if(!g)return;const t=prompt("Tope de la meta (€):",g.target);if(t===null)return;const pr=prompt("Progreso actual (€):",g.progress);if(pr===null)return;g.target=Math.max(0,Number(t)||0);g.progress=Math.max(0,Number(pr)||0);save();render()}
function addGoal(){const n=document.getElementById("newGoalName").value.trim(),t=Number(document.getElementById("newGoalTarget").value)||0,pr=Number(document.getElementById("newGoalProgress").value)||0;if(!n)return alert("Escribe el nombre de la meta.");goals[n]={target:t,progress:pr};save();render()}
function deleteGoal(name){if(confirm(`¿Eliminar la meta "${name}"?`)){delete goals[name];save();render()}}
function render(){
 sortMonth(); renderNav();
 const list=monthsData[active], plan=plannedTotal(), spent=spentTotal(), ri=realIncome(), surplus=ri-plan, remaining=ri-spent;
 const status=surplus>0?`<div class="status surplus">🟢 Excedente frente al total de gastos: ${euro(surplus)}</div>`:surplus<0?`<div class="status short">🔴 Faltan ${euro(Math.abs(surplus))} para cubrir el total de gastos mensual.</div>`:`<div class="status ok">🟢 Ingreso real y gastos mensuales están equilibrados.</div>`;
 const slices=list.filter(p=>Number(p.target)>0);let cur=0,angles=[];
 slices.forEach((p,i)=>{const a=pct(p.target,ri)*3.6;angles.push(`${colors[i%colors.length]} ${cur}deg ${cur+a}deg`);cur+=a});
 if(surplus>0)angles.push(`#16a34a ${cur}deg 360deg`);
 const gradient=angles.length?`conic-gradient(${angles.join(",")})`:"conic-gradient(#e5e7eb 0 360deg)";
 const legend=list.map((p,i)=>`<div class="leg"><span class="dot" style="background:${colors[i%colors.length]}"></span><span>${esc(p.name)} — ${euro(p.target)} <b>${pct(p.target,ri).toFixed(1)}%</b></span></div>`).join("");
 const rows=list.length?list.map((p,i)=>{const target=Number(p.target)||0,actual=Number(p.spent)||0,percent=pct(actual,target),cls=percent>=100?"done":"";return `<div class="partida">
 <div class="phead"><span class="num">${i+1}</span><span class="pname">${esc(p.name)}</span><span class="pamount">${euro(target)}</span></div>
 <div class="pmeta"><div class="mini">Tope mensual<b>${euro(target)}</b></div><div class="mini">Gasto real<b>${euro(actual)}</b></div></div>
 <div class="barline"><span>Progreso del gasto</span><b>${percent.toFixed(0)}%</b></div><div class="progress"><div class="bar ${percent>=100?"over":percent>=100?"done":""}" style="width:${Math.min(100,percent)}%"></div></div>
 <div class="toolbar"><button class="smallbtn" onclick="editPartida('${p.id}')">✏️ Editar</button><button class="smallbtn danger" onclick="deletePartida('${p.id}')">🗑️ Eliminar</button></div>
 </div>`}).join(""):`<div class="empty">No hay partidas para este mes.</div>`;
 document.getElementById("app").innerHTML=`
 <section class="card"><h2>${active} 2027</h2><div class="grid">
 <div class="metric"><small>Total de gastos mensual</small><strong>${euro(plan)}</strong></div>
 <div class="metric"><small>Ingreso real recibido</small><strong>${euro(ri)}</strong></div>
 <div class="metric"><small>Excedente</small><strong>${surplus>0?euro(surplus):"0 €"}</strong></div>
 </div>
 <label><b>💳 Dinero real recibido en tu cuenta</b><input id="realInput" type="number" min="0" step="1" value="${ri}" oninput="saveReal(this.value)"></label>${status}
 <p class="note">El excedente se calcula comparando el ingreso real recibido con el <b>total de gastos mensual</b>. Los topes de las partidas son editables.</p></section>
 <section class="card"><h2>🥧 Distribución del mes</h2><div class="chartbox"><div class="pie" style="background:${gradient}" onclick="pieInfo(event)"><div class="hole">${euro(ri)}<br><small>ingreso real</small></div></div></div><div id="tapInfo" class="status surplus" style="display:none"></div><div class="legend">${legend}${surplus>0?`<div class="leg"><span class="dot" style="background:#16a34a"></span><span>🟢 Excedente — ${euro(surplus)} <b>${pct(surplus,ri).toFixed(1)}%</b></span></div>`:""}</div></section>
 <section class="card"><h2>📊 Barras de progreso · partidas</h2><p class="note">Cada partida tiene su propia barra. Al crear, editar o eliminar una partida, su barra se crea, actualiza o elimina automáticamente.</p>${rows}
 <h3>➕ Nueva partida</h3><div class="formgrid"><input id="newName" class="full" placeholder="Nombre de la partida"><input id="newTarget" type="number" min="0" step="1" placeholder="Tope €"><input id="newSpent" type="number" min="0" step="1" placeholder="Gasto real €"></div><button class="action" onclick="addPartida()">Añadir partida</button></section>
 <section class="card"><h2>🗓️ Recordatorios clave</h2>
 <div class="row"><b>ENERO</b><span>280 € → Napoleón · gastos anuales · Ski · Tenis</span></div><div class="row"><b>MARZO</b><span>Flexipremia → automóvil; sobrante → emergencia</span></div><div class="row"><b>MEDIADOS DE MAYO</b><span>Comprar tiquetes de Egipto</span></div><div class="row"><b>JULIO</b><span>Doble sueldo · tiquetes Colombia · fondo Colombia</span></div><div class="row"><b>AGOSTO</b><span>SOAT + tecnomecánica de Napoleón</span></div><div class="row"><b>OCTUBRE</b><span>🇪🇬 Egipto · presupuesto total 3.150 €</span></div><div class="row"><b>DICIEMBRE</b><span>🇨🇴 Colombia · presupuesto total 5.600 €</span></div></section>
 <section class="card"><h2>🎯 Metas al cierre de 2027</h2><p class="note">Los topes de las metas son editables. El progreso de cada meta también se puede actualizar.</p>${Object.entries(goals).map(([name,g])=>{const target=Number(g.target)||0,progress=Number(g.progress)||0,percent=pct(progress,target);return `<div class="goal"><div class="goaltop"><b>${esc(name)}</b><span>${euro(progress)} / ${euro(target)}</span></div><div class="progress"><div class="bar ${percent>=100?"done":""}" style="width:${Math.min(100,percent)}%"></div></div><div class="goal-actions"><button class="smallbtn" onclick="editGoal(${JSON.stringify(name)})">✏️ Editar tope/progreso</button><button class="smallbtn danger" onclick="deleteGoal(${JSON.stringify(name)})">🗑️ Eliminar</button></div></div>`}).join("")||`<div class="empty">No hay metas creadas.</div>`}<div class="formgrid"><input id="newGoalName" class="full" placeholder="Nombre de la meta"><input id="newGoalTarget" type="number" min="0" step="1" placeholder="Tope €"><input id="newGoalProgress" type="number" min="0" step="1" placeholder="Progreso €"></div><button class="action" onclick="addGoal()">Añadir meta</button></section>
 <section class="card"><h2>📋 Resumen del mes</h2><div class="row"><span>Total de gastos mensual</span><b>${euro(plan)}</b></div><div class="row"><span>Gasto real registrado</span><b>${euro(spent)}</b></div><div class="row"><span>Ingreso real recibido</span><b>${euro(ri)}</b></div><div class="row"><span>Disponible tras gasto real</span><b>${euro(remaining)}</b></div><div class="row"><span>Partidas</span><b>${list.length}</b></div></section>`;
}
function saveReal(v){real[active]=Math.max(0,Number(v)||0);save();render()}
function addPartida(){const n=document.getElementById("newName").value.trim(),t=Number(document.getElementById("newTarget").value)||0,s=Number(document.getElementById("newSpent").value)||0;if(!n)return alert("Escribe el nombre de la partida.");monthsData[active].push({id:uid(),name:n,target:t,spent:s});save();render()}
function editPartida(id){const p=monthsData[active].find(x=>x.id===id);if(!p)return;const n=prompt("Nombre de la partida:",p.name);if(n===null)return;const t=prompt("Tope mensual (€):",p.target);if(t===null)return;const s=prompt("Gasto real (€):",p.spent);if(s===null)return;p.name=n.trim()||p.name;p.target=Math.max(0,Number(t)||0);p.spent=Math.max(0,Number(s)||0);save();render()}
function deletePartida(id){const p=monthsData[active].find(x=>x.id===id);if(!p)return;if(confirm(`¿Eliminar "${p.name}" y su barra de progreso?`)){monthsData[active]=monthsData[active].filter(x=>x.id!==id);save();render()}}
function pieInfo(e){const info=document.getElementById("tapInfo");if(!info)return;const r=e.currentTarget.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let deg=Math.atan2(e.clientY-cy,e.clientX-cx)*180/Math.PI+90;if(deg<0)deg+=360;let acc=0,hit=null,total=realIncome();monthsData[active].forEach((p,i)=>{const end=acc+pct(p.target,total)*3.6;if(!hit&&deg>=acc&&deg<end)hit=[p,i];acc=end});const surplus=total-plannedTotal();if(!hit&&surplus>0&&deg>=acc)hit=[{name:"EXCEDENTE",target:surplus},monthsData[active].length];if(hit){info.style.display="block";info.innerHTML=`<b>${esc(hit[0].name)}</b><br>${euro(hit[0].target)} · ${pct(hit[0].target,total).toFixed(1)}% del ingreso real`}}
render();
if("serviceWorker" in navigator) addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
</script>
</body></html>
